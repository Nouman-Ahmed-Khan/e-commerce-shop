<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts: Cormorant Garamond (serif) + Josefin Sans (sans). Loaded here rather than
         via CSS @import, which Tailwind v4 / Vite drop when it follows @import "tailwindcss". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap"
    />
    <title>VELLUM — Fine Leather Goods</title>
    <!-- Theme init: runs before React to prevent first-paint flash -->
    <script>
      try {
        if (localStorage.getItem('vellum-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
